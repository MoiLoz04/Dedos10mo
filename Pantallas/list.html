<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IndustrIA Mobile - 05 Cotizaciones</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0B0D0F;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
    }
    .phone-frame {
      width: 360px;
      height: 800px;
      background-color: #14171C;
      border-radius: 32px;
      border: 2px solid #2E3540;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      color: #F7F7F4;
      position: relative;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    /* Status Bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #5B6470;
      padding-top: 4px;
    }
    .camera-cutout {
      width: 12px;
      height: 12px;
      background-color: #000000;
      border-radius: 50%;
    }
    /* App Header */
    .app-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 0 8px 0;
      border-bottom: 1px solid #2E3540;
    }
    .back-btn {
      font-size: 18px;
      cursor: pointer;
    }
    .header-title {
      font-size: 16px;
      font-weight: 600;
    }
    /* List Layout */
    .quotes-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 16px;
      margin-bottom: auto;
      overflow-y: auto;
    }
    .quote-card {
      background-color: #1C2128;
      border: 1px solid #2E3540;
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .quote-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .quote-id {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      color: #F7F7F4;
    }
    .badge-sent {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #22C55E;
      background: rgba(34, 197, 94, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .badge-draft {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #5B6470;
      background: rgba(91, 100, 112, 0.15);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .quote-meta {
      font-size: 12px;
      color: #5B6470;
    }
    /* Gesture Bar */
    .gesture-bar-wrapper {
      display: flex;
      justify-content: center;
      padding-bottom: 4px;
    }
    .gesture-bar {
      width: 108px;
      height: 4px;
      background-color: #F7F7F4;
      border-radius: 2px;
    }
  </style>
</head>
<body>

  <div class="phone-frame">
    <!-- Status Bar -->
    <div class="status-bar">
      <span>9:41</span>
      <div class="camera-cutout"></div>
      <span>📶</span>
    </div>

    <!-- App Header -->
    <div class="app-header">
      <span class="back-btn">←</span>
      <span class="header-title">Mis cotizaciones</span>
    </div>

    <!-- Quotes List -->
    <div class="quotes-container">
      <div class="quote-card">
        <div class="quote-card-header">
          <span class="quote-id">COT-2026-001</span>
          <span class="badge-sent">[ENVIADA]</span>
        </div>
        <div class="quote-meta">06/10/2026 · Web</div>
      </div>

      <div class="quote-card">
        <div class="quote-card-header">
          <span class="quote-id">COT-2026-002</span>
          <span class="badge-draft">[BORRADOR]</span>
        </div>
        <div class="quote-meta">05/10/2026 · Smartwatch</div>
      </div>

      <div class="quote-card">
        <div class="quote-card-header">
          <span class="quote-id">COT-2026-003</span>
          <span class="badge-sent">[ENVIADA]</span>
        </div>
        <div class="quote-meta">02/10/2026 · Web</div>
      </div>
    </div>

    <!-- Gesture Bar -->
    <div class="gesture-bar-wrapper">
      <div class="gesture-bar"></div>
    </div>
  </div>

</body>
</html>
