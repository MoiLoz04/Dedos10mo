<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IndustrIA Mobile - 06 QR Inválido</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0B0D0F;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
    }
    .phone-frame {
      width: 360px;
      height: 800px;
      background-color: #14171C;
      border-radius: 32px;
      border: 2px solid #2E3540;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      color: #F7F7F4;
      position: relative;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    /* Status Bar Header */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #5B6470;
      padding-top: 4px;
    }
    .camera-cutout {
      width: 12px;
      height: 12px;
      background-color: #000000;
      border-radius: 50%;
    }
    /* Error Layout Content */
    .error-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 16px;
      margin-top: auto;
      margin-bottom: auto;
    }
    .alert-icon {
      font-size: 56px;
      margin-bottom: 8px;
    }
    .error-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 20px;
      font-weight: 700;
      color: #F7F7F4;
    }
    .error-description {
      font-size: 14px;
      color: #5B6470;
      line-height: 1.5;
      max-width: 280px;
    }
    /* Button Group */
    .action-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }
    .btn-primary {
      width: 100%;
      height: 52px;
      background-color: #22C55E;
      border: none;
      border-radius: 12px;
      color: #14171C;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.3px;
    }
    .btn-secondary {
      width: 100%;
      height: 52px;
      background-color: transparent;
      border: 1px solid #2E3540;
      border-radius: 12px;
      color: #F7F7F4;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.3px;
    }
    /* Gesture Bar */
    .gesture-bar-wrapper {
      display: flex;
      justify-content: center;
      padding-bottom: 4px;
    }
    .gesture-bar {
      width: 108px;
      height: 4px;
      background-color: #F7F7F4;
      border-radius: 2px;
    }
  </style>
</head>
<body>

  <div class="phone-frame">
    <!-- Status Bar -->
    <div class="status-bar">
      <span>9:41</span>
      <div class="camera-cutout"></div>
      <span>📶</span>
    </div>

    <!-- Error Center Content -->
    <div class="error-container">
      <div class="alert-icon">⚠️</div>
      <div class="error-title">Código no válido</div>
      <div class="error-description">
        El código venció, ya se usó o no pertenece a tu cuenta. Genera uno nuevo desde la web.
      </div>

      <div class="action-group">
        <button class="btn-primary">ESCANEAR NUEVAMENTE</button>
        <button class="btn-secondary">VOLVER AL INICIO</button>
      </div>
    </div>

    <!-- Gesture Bar -->
    <div class="gesture-bar-wrapper">
      <div class="gesture-bar"></div>
    </div>
  </div>

</body>
</html>
