<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IndustrIA Mobile - 02 Home Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0B0D0F;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
    }
    .phone-frame {
      width: 360px;
      height: 800px;
      background-color: #14171C;
      border-radius: 32px;
      border: 2px solid #2E3540;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      color: #F7F7F4;
      position: relative;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    /* Status Bar Header */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #5B6470;
      padding-top: 4px;
    }
    .camera-cutout {
      width: 12px;
      height: 12px;
      background-color: #000000;
      border-radius: 50%;
    }
    /* Top Navigation Bar */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0 8px 0;
      border-bottom: 1px solid #2E3540;
    }
    .app-brand {
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      font-weight: 700;
      color: #22C55E;
    }
    .logout-icon {
      font-size: 18px;
      cursor: pointer;
    }
    /* Main Layout */
    .main-body {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 16px;
      margin-bottom: auto;
    }
    .greeting-title {
      font-size: 18px;
      font-weight: 600;
      color: #F7F7F4;
      margin-bottom: 4px;
    }
    .greeting-subtitle {
      font-size: 14px;
      color: #5B6470;
    }
    /* Action Card Container */
    .action-card {
      background-color: #1C2128;
      border: 1px solid #2E3540;
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 8px;
    }
    .icon-badge {
      width: 48px;
      height: 48px;
      background-color: rgba(34, 197, 94, 0.15);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }
    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: #F7F7F4;
    }
    .card-description {
      font-size: 13px;
      color: #5B6470;
      line-height: 1.5;
    }
    .btn-action {
      width: 100%;
      height: 44px;
      background-color: #22C55E;
      border: none;
      border-radius: 10px;
      color: #14171C;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.3px;
    }
    /* Gesture Bar */
    .gesture-bar-wrapper {
      display: flex;
      justify-content: center;
      padding-bottom: 4px;
    }
    .gesture-bar {
      width: 108px;
      height: 4px;
      background-color: #F7F7F4;
      border-radius: 2px;
    }
  </style>
</head>
<body>

  <div class="phone-frame">
    <!-- Status Bar -->
    <div class="status-bar">
      <span>9:41</span>
      <div class="camera-cutout"></div>
      <span>📶</span>
    </div>

    <!-- App Header -->
    <div class="app-header">
      <div class="app-brand">⚡ IndustrIA</div>
      <div class="logout-icon" title="Cerrar sesión">🚪</div>
    </div>

    <!-- Main Content -->
    <div class="main-body">
      <div>
        <div class="greeting-title">Hola, operador@industria.com</div>
        <div class="greeting-subtitle">¿Qué quieres hacer hoy?</div>
      </div>

      <div class="action-card">
        <div class="icon-badge">📷</div>
        <div class="card-title">Escanear código QR</div>
        <div class="card-description">
          Escanea el código de la sección «Vincular app móvil» del sitio web para ver tus cotizaciones.
        </div>
        <button class="btn-action">ESCANEAR CÓDIGO QR</button>
      </div>
    </div>

    <!-- Gesture Bar -->
    <div class="gesture-bar-wrapper">
      <div class="gesture-bar"></div>
    </div>
  </div>

</body>
</html>
