<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IndustrIA Mobile - 04 Validando QR</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0B0D0F;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
    }
    .phone-frame {
      width: 360px;
      height: 800px;
      background-color: #000000;
      border-radius: 32px;
      border: 2px solid #2E3540;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      color: #F7F7F4;
      position: relative;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      overflow: hidden;
    }
    /* Background Darkened Viewport */
    .camera-preview-dimmed {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(11, 13, 15, 0.85);
      z-index: 1;
    }
    .screen-overlay {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    /* Status Bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #5B6470;
      padding-top: 4px;
    }
    .camera-cutout {
      width: 12px;
      height: 12px;
      background-color: #000000;
      border-radius: 50%;
    }
    /* Top Header */
    .app-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 0 8px 0;
      opacity: 0.5;
    }
    .header-title {
      font-size: 16px;
      font-weight: 600;
      color: #F7F7F4;
    }
    /* Modal Card */
    .modal-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: auto;
      margin-bottom: auto;
    }
    .processing-card {
      width: 200px;
      height: 130px;
      background-color: #1C2128;
      border: 1px solid #2E3540;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    /* CSS Spinner */
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(34, 197, 94, 0.2);
      border-top: 3px solid #22C55E;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .processing-text {
      font-size: 14px;
      font-weight: 500;
      color: #F7F7F4;
    }
    /* Gesture Bar */
    .gesture-bar-wrapper {
      display: flex;
      justify-content: center;
      padding-bottom: 4px;
    }
    .gesture-bar {
      width: 108px;
      height: 4px;
      background-color: #F7F7F4;
      border-radius: 2px;
    }
  </style>
</head>
<body>

  <div class="phone-frame">
    <div class="camera-preview-dimmed"></div>

    <div class="screen-overlay">
      <!-- Status Bar -->
      <div class="status-bar">
        <span>9:41</span>
        <div class="camera-cutout"></div>
        <span>📶</span>
      </div>

      <!-- Header -->
      <div class="app-header">
        <span>←</span>
        <span class="header-title">Escanear actividad</span>
      </div>

      <!-- Processing Modal -->
      <div class="modal-container">
        <div class="processing-card">
          <div class="spinner"></div>
          <div class="processing-text">Validando código...</div>
        </div>
      </div>

      <!-- Gesture Bar -->
      <div class="gesture-bar-wrapper">
        <div class="gesture-bar"></div>
      </div>
    </div>
  </div>

</body>
</html>
